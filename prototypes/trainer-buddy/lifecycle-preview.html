  }
  function sendMessage(text) {
    if(!text.trim())return;
    const p=state.page; (state.messages[p] ||= []).push({role:'user',text:(state.reference?`[引用 ${state.reference}]\n`:'')+text});
    let answer='建议先明确要验证的业务变化，再冻结评测协议，建立当前基线。随后只改变一个关键变量，设定 GPU 预算与停止条件，并用同一独立评测集比较。你可以从“研究探索”创建验证实验。';
    if(/只有业务|少量数据/.test(text))answer='先从业务定义开始：列出 3–5 个典型输入、期望输出与不可接受的错误，建立一小批可人工判定的验收样本。接着用开源模型跑基线，再判断适合检索、提示优化还是微调。训练不是默认的第一步。';
    else if(/loss|日志|警告/.test(text))answer='Run-042 的最近损失为 0.842，当前没有发散证据。日志中出现一次数据加载延迟警告，尚不能归因于 GPU 算力。建议对照吞吐、数据等待时间和后续日志观察；需要完整评测才能判断收益。';
    else if(/物流|错误|补数据|缺口/.test(text))answer='物流异常切片通过率为 71.2%，低于整体。先检查“已签收未收到”的核查步骤是否覆盖。可以根据失败类别去业务资料中补数据；测试题目及参考答案保持独立。';
    else if(/断线|任务状态/.test(text))answer='先以远端 job_042 对账。桌面断线只代表缺少新观测，不能认定训练失败。日志按游标续传；取消请求先显示“等待取消确认”，收到远端确认后再更新终态。';
    else if(/发布|回滚/.test(text))answer='候选模型需要通过完整评测、关键切片与时延门槛后才能进入正式发布。部署先执行健康与冒烟测试，再小流量灰度；保留上一稳定版本和路由配置作为回滚点。';
    (state.messages[p]).push({role:'assistant',text:'【演示回复】'+answer}); state.reference='';
    if(p==='buddy')render();else renderBuddy();
  }

    'register-demo'(){if(!$('#model-name').value.trim()||!$('#model-path').value.trim()){toast('请输入名称与权重位置');return;}const name=$('#model-name').value;closeDialogs();toast('已预览登记 '+name+' · 尚未校验权重');},
    'add-host'(){openDialog('新增算力连接',`<p class="secondary">正式产品通过系统凭据管理器保存认证信息。本原型不收集密码和密钥。</p><label>连接名称<input id="host-name" class="input" placeholder="例如：研发 GPU 集群" style="width:100%;margin:8px 0 16px"></label><label>通信方式<select class="input" style="width:100%;margin:8px 0"><option>SSH + 远端 Runner</option><option>集群调度适配器</option></select></label>`,btn('关闭','close-dialog')+btn('预览连接检查','host-check','primary'));},
    'host-check'(){const name=$('#host-name').value.trim();if(!name){toast('请输入连接名称');return;}openDialog('连接检查预览',`<p>${esc(name)} · 以下为正式产品检查项，尚未实际执行。</p><div class="checklist"><div class="check">○ SSH 认证与主机指纹</div><div class="check">○ GPU / 驱动 / CUDA 资源</div><div class="check">○ Runner 安装与版本</div><div class="check">○ 存储、配额与调度权限</div></div>`,btn('关闭','close-dialog'));},
    'extension-toggle'(el){const k=el.dataset.key;state.enabled[k]=!state.enabled[k];render();toast('项目扩展配置已更新 · 本地演示');},
    'extension-detail'(el){openDialog(el.dataset.ref+' · 能力与权限',`<div class="checklist"><div class="check">✓ 读取项目目标与已授权资料</div><div class="check">✓ 生成计划与结构化任务</div><div class="check">○ 远端操作由 Rust 后端和 Runner 执行</div></div><p class="secondary">外部工具调用应记录输入摘要、执行身份、任务关联和结果。本原型没有工具调用。</p>`,btn('关闭','close-dialog'));},
    'close-dialog'(){closeDialogs();},
    search(){openDialog('搜索工作区',`<input id="global-search" class="input" style="width:100%" placeholder="搜索页面、数据或任务…" aria-label="搜索工作区"><div class="search-results" id="search-results">${searchResults('')}</div>`,btn('关闭','close-dialog'));$('#global-search').focus();}
  };
  function searchResults(q) { return [...pages,['compute','算力与连接'],['extensions','Skills 与 MCP'],['training','Run-042 长尾样本增强'],['evaluation','Eval-018 业务评测'],['data','Data-019 数据构建']].filter(([,t])=>t.toLowerCase().includes(q.toLowerCase())).map(([id,title])=>`<button data-action="search-open" data-target="${id}">${icon(id)}<span>${title}</span><span class="muted">↗</span></button>`).join('')||'<p class="empty">没有找到匹配项</p>'; }
  actions['search-open']=el=>{closeDialogs();navigate(el.dataset.target);};
  document.addEventListener('click',e=>{
    const el=e.target.closest('button[data-action],button[data-page],button[data-tab]'); if(!el||el.disabled)return;
    if(el.dataset.action){actions[el.dataset.action]?.(el);return;}
    if(el.dataset.page){navigate(el.dataset.page);return;}
    if(el.dataset.tab){state.tabs[state.page]=el.dataset.tab;render();}
  });
  document.addEventListener('submit',e=>{if(e.target.id==='buddy-form'){e.preventDefault();sendMessage($('#buddy-input').value);}});
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();actions.search();}if(e.target.id==='buddy-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage(e.target.value);}});
  document.addEventListener('input',e=>{if(e.target.id==='global-search')$('#search-results').innerHTML=searchResults(e.target.value);if(e.target.id==='log-search')$('#log-lines').innerHTML=renderLogs(e.target.value,$('#log-warn').checked);});
  document.addEventListener('change',e=>{if(e.target.id==='log-warn')$('#log-lines').innerHTML=renderLogs($('#log-search').value,e.target.checked);if(e.target.id==='demo-file')$('#file-result').textContent=Array.from(e.target.files).map(f=>f.name).join('、')||'尚未选择文件';});
  window.addEventListener('hashchange',()=>{if(titles[location.hash.slice(1)])navigate(location.hash.slice(1));});
  for(const id of ['#modal','#sheet'])$(id).addEventListener('click',e=>{if(e.target===$(id)){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
  setInterval(()=>{if(state.sim&&state.connected&&state.train==='running'){state.step=Math.min(3000,state.step+25);if(state.step===3000){state.train='completed';state.sim=false;}if(state.page==='training'||state.page==='overview')render();else updateFooter();}},2000);
  render();
})();

</script>
</body>
</html>
